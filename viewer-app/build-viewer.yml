name: Build Bardi Viewer
on:
  workflow_dispatch:
  push:
    paths:
      - 'viewer-app/**'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang dan bangun
        working-directory: viewer-app
        run: |
          npm install
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Bardi-Viewer-Windows
          path: viewer-app/dist/Bardi-Viewer-Setup.exe
